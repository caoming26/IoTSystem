<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    .sidebar {
        width: 250px;
        background: #2c3e50;
        color: white;
        padding: 20px;
        min-height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .logo {
        padding: 20px 0;
        text-align: center;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        margin-bottom: 20px;
    }

    .logo h2 {
        margin: 0;
        font-size: 24px;
    }

    .nav-item {
        padding: 15px 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        margin: 5px 0;
        border-radius: 5px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .nav-item:hover {
        background: rgba(255,255,255,0.1);
    }

    .nav-item.active {
        background: #3498db;
    }

    .nav-item i {
        width: 20px;
        text-align: center;
    }

    .nav-item span {
        font-size: 16px;
    }
</style>
<head>
</head>
<body>
<div th:fragment="sidebar" class="sidebar">
    <div>
        <div class="logo">
            <h2>Server SystemCare</h2>
        </div>
        <div class="nav-item" onclick="window.location.href='/'">
            <i class="fa-regular fa-chart-bar fa-fw"></i>
            <span>Dashboard</span>
        </div>
        <div class="nav-item" onclick="window.location.href='/report'">
            <i class="fa-regular fa-file-alt fa-fw"></i>
            <span>Reports</span>
        </div>
        <div class="nav-item" onclick="window.location.href='/settings'">
            <i class="fa-solid fa-gear fa-fw"></i>
            <span>Settings</span>
        </div>
    </div>
    <!-- Logout button at the bottom -->
    <div onclick="window.location.href='/logout'" style="margin-top: auto; padding: 15px 20px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: #e74c3c; transition: all 0.3s ease; background-color: rgba(255, 255, 255, 0); border-radius: 0px;"
         onmouseover="this.style.backgroundColor='rgba(255, 255, 255, 0.1)'; this.style.borderRadius='5px';"
         onmouseout="this.style.backgroundColor='rgba(255, 255, 255, 0)'; this.style.borderRadius='0px';">
        <i class="fa-solid fa-right-from-bracket fa-fw" style="width: 20px; text-align: center;"></i>
        <span style="font-size: 16px;">Logout</span>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const navItems = document.querySelectorAll(".nav-item");
            navItems.forEach(item => {
                const href = item.getAttribute("onclick").match(/window\.location\.href='([^']+)'/)[1];
                if (window.location.pathname === href) {
                    item.classList.add("active");
                } else {
                    item.classList.remove("active");
                }
            });
        });
    </script>
</div>
</body>
</html>
