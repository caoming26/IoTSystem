<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Font Awesome -->
<!--    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.0/css/all.min.css}"/>-->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(120deg, #3498db, #8e44ad);
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #3498db;
            outline: none;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-primary {
            background-color: #3498db;
            color: white;
            margin-bottom: 15px;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        .btn-secondary {
            background-color: #95a5a6;
            color: white;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            background-color: #7f8c8d;
        }

        .register-link {
            text-align: center;
            font-size: 14px;
            color: #7f8c8d;
        }

        .register-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background-color: #ddd;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .divider span {
            background-color: white;
            padding: 0 10px;
            color: #7f8c8d;
            font-size: 14px;
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            border-radius: 4px;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .alert.show {
            display: block;
            opacity: 1;
        }

        .alert-danger {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        .alert-success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
        }

        /* Thêm animation cho thông báo */
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>Đăng nhập</h1>
        <p>Vui lòng đăng nhập để tiếp tục</p>
    </div>

    <!-- Hiển thị thông báo lỗi -->
    <div id="error-message" class="alert alert-danger d-none">
        Tên đăng nhập hoặc mật khẩu không chính xác
    </div>

    <!-- Hiển thị thông báo logout -->
    <div id="logout-message" class="alert alert-success d-none">
        Bạn đã đăng xuất thành công
    </div>

    <!-- Form đăng nhập với CSRF token -->
    <form id="loginForm" th:action="@{/api/login}" method="post">
<!--        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />-->

        <div class="input-group">
            <label for="username">Email</label>
            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Nhập email mà bạn đăng ký"
                   required>
        </div>

        <div class="input-group">
            <label for="password">Mật khẩu</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Nhập mật khẩu"
                   required minlength="6"> <!-- Ví dụ về yêu cầu mật khẩu tối thiểu -->
        </div>

        <div class="forgot-password">
            <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="fas fa-sign-in-alt"></i> Đăng nhập
        </button>

        <div class="divider">
            <span>hoặc</span>
        </div>

        <a th:href="@{/rfid-login}" class="btn btn-secondary">
            <i class="fas fa-id-card"></i> Đăng nhập bằng RFID
        </a>

        <div class="register-link">
            Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a>
        </div>
    </form>
</div>

<!-- JavaScript -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('error-message');
        const logoutMessage = document.getElementById('logout-message');

        // Kiểm tra URL parameters
        const urlParams = new URLSearchParams(window.location.search);

        // Xử lý thông báo đăng xuất
        if (urlParams.has('logout')) {
            logoutMessage.classList.remove('d-none');
            logoutMessage.classList.add('show');
            // Tự động ẩn thông báo sau 3 giây
            setTimeout(() => {
                logoutMessage.classList.add('fade-out');
                setTimeout(() => {
                    logoutMessage.classList.remove('show', 'fade-out');
                }, 500);
            }, 3000);
        }

        // Xử lý thông báo lỗi đăng nhập
        if (urlParams.has('error')) {
            errorMessage.classList.remove('d-none');
        }

        // Reset error message khi form được submit
        loginForm.addEventListener('submit', function(event) {
            if (!loginForm.checkValidity()) {
                event.preventDefault();
                errorMessage.classList.remove('d-none');
            } else {
                errorMessage.classList.add('d-none');
            }
        });

        // Xóa thông báo lỗi khi user bắt đầu nhập
        document.getElementById('username').addEventListener('input', function() {
            errorMessage.classList.add('d-none');
        });

        document.getElementById('password').addEventListener('input', function() {
            errorMessage.classList.add('d-none');
        });

        // Thêm AJAX để xử lý đăng nhập
        loginForm.addEventListener('submit', function(event) {
            event.preventDefault(); // Ngăn chặn submit mặc định
            const formData = new FormData(loginForm);
            fetch(loginForm.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json',
                }
            })
                .then(response => {
                    if (response.ok) {
                        window.location.href = '/'; // Chuyển hướng đến trang chủ
                    } else {
                        errorMessage.classList.remove('d-none');
                    }
                })
                .catch(error => {
                    console.error('Có lỗi xảy ra:', error);
                    errorMessage.classList.remove('d-none');
                });
        });
    });
</script>
</body>
</html>
